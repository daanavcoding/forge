name: Verify official model pricing

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: update-model-pricing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify official pricing catalog
        run: npm run pricing:check

      - name: Verify plugin contracts
        run: npm run plugin:check
